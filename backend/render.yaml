services:
  - type: web
    name: sanjeevani-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL_NAME
        value: gemma-2-9b-it
